<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>数字签名申请</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="./signature_pad.umd.js"></script>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #F7F8FA; display: flex; flex-direction: column; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .canvas-wrapper {
            flex: 1; margin: 16px; margin-top: 8px; background-color: #0F172A; position: relative; 
            border-radius: 20px;
            box-shadow: 0 10px 40px -10px rgba(15, 23, 42, 0.3), inset 0 0 0 1px rgba(255,255,255,0.1);
        }
        .placeholder {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.15); font-size: 28px; font-weight: 600; pointer-events: none; transition: opacity 0.3s;
            writing-mode: vertical-rl;
            letter-spacing: 12px;
            user-select: none;
        }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; border-radius: 20px;}
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col text-gray-900 pb-safe">

    <!-- 顶部导航栏 (Glassmorphism) -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex items-center justify-between">
        <button id="closeBtn" class="flex items-center justify-center w-8 h-8 -ml-1 text-gray-600 active:opacity-50 transition-opacity rounded-full">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
        </button>
        <span class="text-[17px] font-medium truncate flex-1 text-center pr-7">手写数字签名</span>
    </header>

    <div class="px-5 pt-4 pb-2 flex justify-center items-center text-[13px] text-gray-500 font-medium slide-up">
        <svg class="w-4 h-4 mr-1.5 text-[#0A56F6]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
        请在下方深色区域内书写您的真实姓名
    </div>

    <div class="canvas-wrapper slide-up" style="animation-delay: 0.1s;">
        <div class="placeholder" id="placeholder">手写区域</div>
        <canvas id="signatureCanvas"></canvas>
    </div>

    <footer class="bg-white px-5 py-4 pb-[env(safe-area-inset-bottom,20px)] flex gap-3 shadow-[0_-10px_30px_rgba(0,0,0,0.02)] z-10 slide-up" style="animation-delay: 0.2s;">
        <button id="clearBtn" class="flex-1 py-3.5 bg-[#F3F4F6] hover:bg-gray-200 active:scale-[0.98] text-gray-700 font-medium rounded-[16px] transition-all">
            重新书写
        </button>
        <button id="saveBtn" class="flex-[2] py-3.5 bg-[#0A56F6] hover:bg-blue-700 active:scale-[0.98] text-white font-medium rounded-[16px] shadow-[0_8px_20px_rgb(10,86,246,0.25)] transition-all">
            确认提交
        </button>
    </footer>

    <script>
        const canvas = document.getElementById('signatureCanvas');
        const placeholder = document.getElementById('placeholder');
        const ratio = Math.max(window.devicePixelRatio || 1, 1);

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // 用户界面：透明底 + 白笔迹
        const signaturePad = new SignaturePad(canvas, {
            backgroundColor: 'rgba(0,0,0,0)', 
            penColor: 'rgb(255, 255, 255)',  
            minWidth: 1.5, maxWidth: 3.5 
        });

        const hidePlaceholder = () => { placeholder.style.opacity = '0'; };
        canvas.addEventListener('touchstart', hidePlaceholder);
        canvas.addEventListener('mousedown', hidePlaceholder);

        document.getElementById('clearBtn').addEventListener('click', () => {
            signaturePad.clear();
            placeholder.style.opacity = '1';
        });

        document.getElementById('closeBtn').addEventListener('click', () => { window.history.back(); });

        // --- 核心转换与提交逻辑 ---
        document.getElementById('saveBtn').addEventListener('click', () => {
            if (signaturePad.isEmpty()) return alert("请在框内签名后再提交！");

            // 1. 获取原轨迹数据
            const pointData = signaturePad.toData();

            // 2. 创建一个离屏 Canvas，用于画【白底黑字】
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCanvas.getContext('2d').scale(ratio, ratio);

            const tempPad = new SignaturePad(tempCanvas, {
                backgroundColor: 'rgb(255, 255, 255)', // 强制白底
                penColor: 'rgb(0, 0, 0)',             // 强制黑字
                minWidth: 1.5, maxWidth: 3.5 
            });
            tempPad.fromData(pointData); // 把轨迹重绘在白底黑字画板上

            // 3. 创建最终 Canvas，用于【横屏转竖屏 (顺时针旋转90度)】
            const finalCanvas = document.createElement('canvas');
            // 宽高互换
            finalCanvas.width = tempCanvas.height;
            finalCanvas.height = tempCanvas.width;
            const ctx = finalCanvas.getContext('2d');

            // 执行旋转矩阵：平移到右上角，然后顺时针旋转 90 度
            ctx.translate(finalCanvas.width, 0);
            ctx.rotate(Math.PI / 2);
            // 将白底黑字的图片画上去
            ctx.drawImage(tempCanvas, 0, 0);

            // 4. 导出最终的 JPEG 图片（白底不需要透明度，用 JPEG 更小）
            const finalBase64 = finalCanvas.toDataURL('image/jpeg', 0.9);

            // 5. 模拟上传服务器并回调
            // 实际业务： fetch('/api/upload', { body: finalBase64 }).then(res => ...)
            
            // 使用 sessionStorage 在 H5 跨页面传参
            sessionStorage.setItem('upload_sign_result', finalBase64);
            
            // 返回上一页触发回调
            window.history.back();
        });
    </script>
</body>
</html>
