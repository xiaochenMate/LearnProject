<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>业务办理页面</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f4f5f7; }
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <!-- 顶部状态栏及导航 -->
    <header class="bg-white px-4 py-3 flex items-center justify-between shadow-sm sticky top-0 z-10">
        <!-- 为了严谨，建议将左上角自带的返回也绑定关闭逻辑，以防万一 -->
        <div class="flex items-center text-gray-800 font-medium text-lg cursor-pointer" onclick="handleTopBack()">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            个人贷款申请
        </div>
    </header>

    <main class="p-4 safe-area-pb">
        <!-- 核心业务卡片 -->
        <div class="bg-white rounded-xl shadow-sm p-5 mb-5 slide-up" style="animation-delay: 0.1s;">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-gray-500 text-sm font-medium">申请金额 (元)</h2>
                <span id="statusTag" class="text-xs px-2 py-1 bg-blue-50 text-blue-600 rounded">待签名</span>
            </div>
            <div class="text-3xl font-semibold text-gray-900 mb-6 font-mono">¥ 890.00</div>
            
            <div class="space-y-3 text-sm">
                <div class="flex justify-between border-b border-gray-100 pb-3">
                    <span class="text-gray-500">业务编号</span>
                    <span class="text-gray-800 font-medium tracking-wide">FIN_ORD_20260311</span>
                </div>
                <div class="flex justify-between border-b border-gray-100 pb-3">
                    <span class="text-gray-500">贷款期限</span>
                    <span class="text-gray-800 font-medium">12个月</span>
                </div>
                <div class="flex justify-between pb-1">
                    <span class="text-gray-500">收款账户</span>
                    <span class="text-gray-800 font-medium">工商银行 (尾号8888)</span>
                </div>
            </div>
        </div>

        <!-- 动作按钮区（成功后会被隐藏） -->
        <div id="actionBtnGroup" class="text-center slide-up" style="animation-delay: 0.2s;">
            <!-- 增加onclick事件，用于在跳走前保存页面数据(如有必要) -->
            <a href="write.html" onclick="saveDataBeforeLeave()" class="block w-full py-3.5 bg-blue-600 text-white rounded-lg text-base font-medium shadow-md shadow-blue-200 active:bg-blue-700 transition">
                前往手写签名
            </a>
            <p class="mt-3 text-xs text-gray-400">点击进入签名页，提交后自动返回此页</p>
        </div>
        
        <!-- 用于展示回调返回的竖屏白底黑字签名 -->
        <div id="resultBox" class="bg-white rounded-xl shadow-sm p-5 mt-6 hidden slide-up" style="animation-delay: 0.1s;">
            <div class="flex items-center text-green-600 mb-3">
                <svg class="w-5 h-5 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                <span class="font-medium text-base">签名验证成功</span>
            </div>
            <p class="text-xs text-gray-500 mb-4">(已自动转换为白底黑字 + 竖屏显示)</p>
            <div class="border border-gray-200 rounded-lg overflow-hidden bg-gray-50 flex items-center justify-center p-2 mb-5">
                <!-- 预留占位符，如果没图片测试，可以放个裂图或默认图 -->
                <img id="signImage" src="" alt="签名结果" class="max-h-64 object-contain drop-shadow-md bg-white text-xs text-gray-400">
            </div>

            <!-- 新增：页面底部的关闭按钮 -->
            <button onclick="closeCurrentPage()" class="w-full py-3 bg-gray-100 text-gray-700 rounded-lg text-base font-medium active:bg-gray-200 transition border border-gray-200">
                完成并退出
            </button>
        </div>
    </main>

    <script>
        // ==========================================
        // 1. 多渠道安全关闭页面逻辑
        // ==========================================
        function closeCurrentPage() {
            var ua = navigator.userAgent.toLowerCase();
            var isWechat = ua.indexOf('micromessenger') !== -1;
            var isMiniProgram = isWechat && (ua.indexOf('miniprogram') !== -1 || window.__wxjs_environment === 'miniprogram');
            
            if (isMiniProgram) {
                // 【微信小程序环境】动态注入 SDK 并返回
                if (typeof wx === "undefined" || !wx.miniProgram) {
                    var script = document.createElement('script');
                    script.src = 'https://res.wx.qq.com/open/js/jweixin-1.6.0.js';
                    script.onload = function() {
                        wx.miniProgram.navigateBack({ delta: 1 });
                    };
                    document.body.appendChild(script);
                } else {
                    wx.miniProgram.navigateBack({ delta: 1 });
                }
            } 
            else if (isWechat) {
                // 【普通微信环境】
                if (typeof WeixinJSBridge !== "undefined") {
                    WeixinJSBridge.call('closeWindow');
                } else {
                    document.addEventListener('WeixinJSBridgeReady', function() {
                        WeixinJSBridge.call('closeWindow');
                    }, false);
                }
            } 
            else if (ua.indexOf('your_app_keyword') !== -1) { 
                // 【自建 App 环境】这里替换为你自家的关键字
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ClosePage) {
                    window.webkit.messageHandlers.ClosePage.postMessage(null);
                } else if (window.AndroidBridge && window.AndroidBridge.closePage) {
                    window.AndroidBridge.closePage();
                }
            } 
            else {
                // 【普通电脑/手机浏览器测试环境兜底】
                alert("已触发关闭页面指令！（当前为普通浏览器环境，无法直接关闭窗口）");
                // window.location.replace("index.html"); // 实际线上可以重定向到主页
            }
        }

        // ==========================================
        // 2. 核心：历史记录劫持（防后退报错）
        // ==========================================
        let isLocked = false; // 加个锁标记，防止重复监听
        
        function lockResultPage() {
            if (isLocked) return;
            isLocked = true;

            // 强行推入垫背历史记录
            history.pushState({ page: 'result_locked' }, null, window.location.href);

            // 监听用户点击左上角物理/虚拟返回按钮
            window.addEventListener('popstate', function (event) {
                // 拦截后退，直接调用关闭逻辑
                closeCurrentPage();

                // (兜底) 再次推入历史记录，防止在普通浏览器里真的退回去了
                history.pushState({ page: 'result_locked' }, null, window.location.href);
            }, false);
        }

        // 顶部自带的返回按钮逻辑
        function handleTopBack() {
            if (isLocked) {
                closeCurrentPage(); // 如果已经锁定（已签名），走关闭逻辑
            } else {
                window.history.back(); // 如果还没签名，正常后退
            }
        }

        // 去签名之前的处理（可以把页面数据存起来防丢失）
        function saveDataBeforeLeave() {
            // 这里可以加 sessionStorage.setItem('form_data', ...);
        }

        // ==========================================
        // 3. 业务初始化逻辑 (从写字板返回后的接手处理)
        // ==========================================
        window.addEventListener('pageshow', function() {
            const signData = sessionStorage.getItem('upload_sign_result');
            
            if (signData) {
                // 1. 渲染结果页
                document.getElementById('signImage').src = signData;
                document.getElementById('resultBox').classList.remove('hidden');
                
                // 隐藏原先的去签名按钮，并改变顶部状态文字
                document.getElementById('actionBtnGroup').classList.add('hidden');
                let tag = document.getElementById('statusTag');
                tag.innerText = "已完成";
                tag.className = "text-xs px-2 py-1 bg-green-50 text-green-600 rounded";
                
                // 2. 清除数据，防止刷新重复触发
                sessionStorage.removeItem('upload_sign_result');
                
                setTimeout(() => {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }, 100);

                // 🌟 3. 最关键的一步：立刻锁死页面，接管返回按钮！
                lockResultPage();
            }
        });
        
        // 【便于你在本地测试】取消下面的注释，打开页面一秒后自动假装签名成功
        /*
        setTimeout(() => {
            sessionStorage.setItem('upload_sign_result', 'https://via.placeholder.com/300x150?text=Test+Signature');
            // 触发一个假的 pageshow 去执行渲染
            window.dispatchEvent(new Event('pageshow'));
        }, 1000);
        */
    </script>
</body>
</html>
