<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>个人贷款申请</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: #F7F8FA; 
            -webkit-font-smoothing: antialiased;
        }
        .slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Hide scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-gray-900 pb-safe">

    <!-- 顶部导航栏 (Glassmorphism) -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-100 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center text-gray-800 font-medium cursor-pointer active:opacity-50 transition-opacity" onclick="handleTopBack()">
            <svg class="w-6 h-6 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            <span class="text-[17px]">个人贷款申请</span>
        </div>
    </header>

    <main class="px-4 py-6 max-w-lg mx-auto">
        <!-- 核心金额卡片 -->
        <div class="bg-white rounded-[20px] p-6 mb-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] slide-up" style="animation-delay: 0.05s;">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-gray-500 text-[15px]">申请金额</h2>
                <div id="statusTag" class="flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 bg-amber-50 text-amber-600 rounded-full border border-amber-100 transition-colors duration-300">
                    <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span id="statusText">待签名</span>
                </div>
            </div>
            
            <div class="flex items-baseline gap-1 mb-8">
                <span class="text-2xl font-semibold text-gray-900">¥</span>
                <span class="text-[40px] font-bold text-gray-900 tracking-tight leading-none">890.00</span>
            </div>
            
            <div class="bg-gray-50 rounded-2xl p-4 space-y-4 text-[14px]">
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">业务编号</span>
                    <span class="text-gray-900 font-medium font-mono">FIN_ORD_20260311</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">贷款期限</span>
                    <span class="text-gray-900 font-medium">12个月</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">收款账户</span>
                    <div class="flex items-center gap-2">
                        <div class="w-4 h-4 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-[10px] font-bold">工</div>
                        <span class="text-gray-900 font-medium">工商银行 (8888)</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 协议提示 -->
        <div id="agreementBox" class="flex items-start gap-2 mb-8 px-1 slide-up" style="animation-delay: 0.15s;">
            <div class="mt-0.5 w-4 h-4 rounded-full bg-[#0A56F6] flex items-center justify-center shrink-0">
                <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <p class="text-[13px] text-gray-500 leading-relaxed">
                我已阅读并同意
                <a href="#" class="text-[#0A56F6] font-medium">《个人贷款借款合同》</a>
                及
                <a href="#" class="text-[#0A56F6] font-medium">《相关授权协议》</a>，点击下方按钮即表示本人自愿签署。
            </p>
        </div>

        <!-- 动作按钮区 -->
        <div id="actionBtnGroup" class="slide-up" style="animation-delay: 0.2s;">
            <a href="write.html" onclick="saveDataBeforeLeave()" class="flex items-center justify-center w-full py-4 bg-[#0A56F6] hover:bg-blue-700 active:scale-[0.98] text-white rounded-[16px] text-[17px] font-medium shadow-[0_8px_20px_rgb(10,86,246,0.25)] transition-all">
                <svg class="w-5 h-5 mr-2 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                前往手写签名
            </a>
            <div class="flex items-center justify-center gap-1 mt-4 text-[12px] text-gray-400">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                <span>银行级加密传输保障您的信息安全</span>
            </div>
        </div>
        
        <!-- 签名结果展示区 -->
        <div id="resultBox" class="bg-white rounded-[20px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] p-6 mt-2 hidden slide-up" style="animation-delay: 0.1s;">
            <div class="flex flex-col items-center justify-center mb-6">
                <div class="w-14 h-14 bg-green-50 text-green-500 rounded-full flex items-center justify-center mb-3">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <h3 class="font-semibold text-lg text-gray-900">签署完成</h3>
                <p class="text-[13px] text-gray-500 mt-1">合同已生效，款项将发放至指定账户</p>
            </div>
            
            <div class="relative border border-gray-100 rounded-[16px] overflow-hidden bg-[#FAFAFA] flex items-center justify-center p-4 mb-6 group">
                <div class="absolute top-3 left-3 text-[11px] font-medium text-gray-400 uppercase tracking-wider">电子签名留存</div>
                <img id="signImage" src="" alt="签名结果" class="max-h-48 w-full object-contain mix-blend-multiply opacity-90 transition-transform duration-500 group-hover:scale-105">
            </div>

            <button onclick="closeCurrentPage()" class="w-full py-4 bg-gray-900 text-white rounded-[16px] text-[17px] font-medium active:scale-[0.98] transition-all shadow-[0_8px_20px_rgb(0,0,0,0.15)]">
                完成并退出
            </button>
        </div>
    </main>

    <script>
        // ==========================================
        // 1. 多渠道安全关闭页面逻辑
        // ==========================================
        function closeCurrentPage() {
            var ua = navigator.userAgent.toLowerCase();
            var isWechat = ua.indexOf('micromessenger') !== -1;
            var isMiniProgram = isWechat && (ua.indexOf('miniprogram') !== -1 || window.__wxjs_environment === 'miniprogram');
            
            if (isMiniProgram) {
                // 【微信小程序环境】动态注入 SDK 并返回
                if (typeof wx === "undefined" || !wx.miniProgram) {
                    var script = document.createElement('script');
                    script.src = 'https://res.wx.qq.com/open/js/jweixin-1.6.0.js';
                    script.onload = function() {
                        wx.miniProgram.navigateBack({ delta: 1 });
                    };
                    document.body.appendChild(script);
                } else {
                    wx.miniProgram.navigateBack({ delta: 1 });
                }
            } 
            else if (isWechat) {
                // 【普通微信环境】
                if (typeof WeixinJSBridge !== "undefined") {
                    WeixinJSBridge.call('closeWindow');
                } else {
                    document.addEventListener('WeixinJSBridgeReady', function() {
                        WeixinJSBridge.call('closeWindow');
                    }, false);
                }
            } 
            else if (ua.indexOf('your_app_keyword') !== -1) { 
                // 【自建 App 环境】这里替换为你自家的关键字
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ClosePage) {
                    window.webkit.messageHandlers.ClosePage.postMessage(null);
                } else if (window.AndroidBridge && window.AndroidBridge.closePage) {
                    window.AndroidBridge.closePage();
                }
            } 
            else {
                // 【普通电脑/手机浏览器测试环境兜底】
                alert("已触发关闭页面指令！（当前为普通浏览器环境，无法直接关闭窗口）");
                // window.location.replace("index.html"); // 实际线上可以重定向到主页
            }
        }

        // ==========================================
        // 2. 核心：历史记录劫持（防后退报错）
        // ==========================================
        let isLocked = false; // 加个锁标记，防止重复监听
        
        function lockResultPage() {
            if (isLocked) return;
            isLocked = true;

            // 强行推入垫背历史记录
            history.pushState({ page: 'result_locked' }, null, window.location.href);

            // 监听用户点击左上角物理/虚拟返回按钮
            window.addEventListener('popstate', function (event) {
                // 拦截后退，直接调用关闭逻辑
                closeCurrentPage();

                // (兜底) 再次推入历史记录，防止在普通浏览器里真的退回去了
                history.pushState({ page: 'result_locked' }, null, window.location.href);
            }, false);
        }

        // 顶部自带的返回按钮逻辑
        function handleTopBack() {
            if (isLocked) {
                closeCurrentPage(); // 如果已经锁定（已签名），走关闭逻辑
            } else {
                window.history.back(); // 如果还没签名，正常后退
            }
        }

        // 去签名之前的处理（可以把页面数据存起来防丢失）
        function saveDataBeforeLeave() {
            // 这里可以加 sessionStorage.setItem('form_data', ...);
        }

        // ==========================================
        // 3. 业务初始化逻辑 (从写字板返回后的接手处理)
        // ==========================================
        window.addEventListener('pageshow', function() {
            const signData = sessionStorage.getItem('upload_sign_result');
            
            if (signData) {
                // 1. 渲染结果页
                document.getElementById('signImage').src = signData;
                document.getElementById('resultBox').classList.remove('hidden');
                
                // 隐藏原先的去签名按钮，并改变顶部状态文字
                document.getElementById('actionBtnGroup').classList.add('hidden');
                
                const agreementBox = document.getElementById('agreementBox');
                if (agreementBox) agreementBox.classList.add('hidden');

                let tag = document.getElementById('statusTag');
                if (tag) tag.className = "flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 bg-green-50 text-green-600 rounded-full border border-green-100 transition-colors duration-300";
                
                let dot = document.getElementById('statusDot');
                if (dot) dot.className = "w-1.5 h-1.5 rounded-full bg-green-500";
                
                let text = document.getElementById('statusText');
                if (text) text.innerText = "已完成";
                
                // 2. 清除数据，防止刷新重复触发
                sessionStorage.removeItem('upload_sign_result');
                
                setTimeout(() => {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }, 100);

                // 🌟 3. 最关键的一步：立刻锁死页面，接管返回按钮！
                lockResultPage();
            }
        });
        
        // 【便于你在本地测试】取消下面的注释，打开页面一秒后自动假装签名成功
        /*
        setTimeout(() => {
            sessionStorage.setItem('upload_sign_result', 'https://via.placeholder.com/300x150?text=Test+Signature');
            // 触发一个假的 pageshow 去执行渲染
            window.dispatchEvent(new Event('pageshow'));
        }, 1000);
        */
    </script>
</body>
</html>
